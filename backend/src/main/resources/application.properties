spring.application.name=backend
spring.mongodb.protocol=mongodb+srv
spring.mongodb.uri=${MONGODB_URI}
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.client-name=GitHub

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

frontend.uri=${FRONTEND_URI}
app.jwt.secret=${JWT_SECRET}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

app.cache.redis.ttl=${REDIS_CACHE_TTL:PT1M}

email.uri=${EMAIL_URI}
email.secret=${EMAIL_SECRET}
supabase.api.key=${SUPABASE_API_KEY}
supabase.uri=${SUPABASE_URI}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.nats.url=${NATS_URL:nats://localhost:4222}
app.nats.alert-subject=${NATS_ALERTS_SUBJECT:upblit.alerts}

app.patreon.enabled=${PATREON_ENABLED:false}
app.patreon.client-id=${PATREON_CLIENT_ID:}
app.patreon.client-secret=${PATREON_CLIENT_SECRET:}
app.patreon.join-url=${PATREON_JOIN_URL:https://www.patreon.com/Upblit}
app.patreon.callback-url=${PATREON_CALLBACK_URL:https://api.upblit.dev/auth/patreon/callback}
app.patreon.creator-access-token=${PATREON_CREATOR_ACCESS_TOKEN:}
app.patreon.creator-refresh-token=${PATREON_CREATOR_REFRESH_TOKEN:}
app.patreon.creator-token-expires-at=${PATREON_CREATOR_TOKEN_EXPIRES_AT:}
app.patreon.campaign-id=${PATREON_CAMPAIGN_ID:}
app.patreon.supernova-tier-title=${PATREON_SUPERNOVA_TIER_TITLE:Supernova}
app.patreon.supernova-tier-amount-cents=${PATREON_SUPERNOVA_TIER_AMOUNT_CENTS:2000}
app.patreon.user-agent=${PATREON_USER_AGENT:Upblit Patreon Sync}
app.patreon.sync-delay-ms=${PATREON_SYNC_DELAY_MS:3600000}